name: CD - Homologação BFF

on:
  workflow_run:
    workflows: ["CI - BFF"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: railway-bff-homologacao
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar BFF no Railway
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}

    steps:
      - name: Confirmar commit atual e CI aprovada
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$CURRENT_SHA" != "$DEPLOY_SHA" ]; then
            echo "::notice::Commit superado por outra atualização da main; publicação ignorada."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          APPROVED=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f head_sha="$DEPLOY_SHA" -f status=success \
            --jq '[.workflow_runs[] | select(.event == "push")] | length')
          if [ "$APPROVED" -eq 0 ]; then
            echo "::error::Não há CI aprovada na main para o commit solicitado."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Obter o código aprovado
        if: steps.source.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Preparar Node
        if: steps.source.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Conferir configuração de publicação
        if: steps.source.outputs.publish == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT_ID RAILWAY_SERVICE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name para o CD de homologação do BFF."
              exit 1
            fi
          done

      - name: Validar o artefato que será publicado
        if: steps.source.outputs.publish == 'true'
        run: |
          npm ci
          npm run build
          test -s dist/server.js || {
            echo "::error::Artefato obrigatório ausente: dist/server.js"
            exit 1
          }

      - name: Instalar CLI do Railway
        if: steps.source.outputs.publish == 'true'
        run: npm install --global @railway/cli@5.71.0

      - name: Publicar no Railway
        if: steps.source.outputs.publish == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --message "GitHub Actions: $DEPLOY_SHA"

      - name: Aguardar serviço saudável
        if: steps.source.outputs.publish == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          for attempt in {1..60}; do
            DEPLOYMENTS=$(railway deployment list \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --service "$RAILWAY_SERVICE_ID" \
              --limit 1 --json)
            DEPLOYMENT_ID=$(node -e 'const data = JSON.parse(process.argv[1]); console.log(data[0]?.id ?? "")' "$DEPLOYMENTS")
            STATUS=$(node -e 'const data = JSON.parse(process.argv[1]); console.log(data[0]?.status ?? "")' "$DEPLOYMENTS")
            echo "Deploy ${DEPLOYMENT_ID:-indisponível}: ${STATUS:-aguardando}"
            case "$STATUS" in
              SUCCESS)
                echo "::notice::BFF publicado e saudável no Railway: $DEPLOYMENT_ID"
                exit 0
                ;;
              FAILED|CRASHED|REMOVED)
                echo "::error::O deploy do BFF não ficou saudável: $STATUS ($DEPLOYMENT_ID)."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Tempo esgotado aguardando o deploy do BFF."
          exit 1
