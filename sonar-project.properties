sonar.projectKey=fga-eps-mds_2026-2-AnatoQuizUp-BFF
sonar.organization=fga-eps-mds-1

# Código de produção e arquivos de teste são classificados separadamente.
sonar.sources=src
sonar.tests=tests,src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/__mocks__/**

# Relatórios gerados pelo Jest.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=sonar-report.xml
sonar.coverage.exclusions=src/server.ts,**/*.d.ts

# Os cenarios do OSCE sao dados declarativos: tres casos clinicos com a mesma forma
# de objeto e de rubrica, com conteudo diferente em cada um. O detector de copia le
# essa repeticao de estrutura como duplicacao (~28% do arquivo), que e justamente o
# que torna os casos comparaveis entre si. Nada a extrair aqui sem piorar a leitura.
sonar.cpd.exclusions=src/shared/constants/cenarios-osce.ts
sonar.sourceEncoding=UTF-8
